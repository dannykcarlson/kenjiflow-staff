<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KenjiFlow Staff · Bot faces</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 32px; background: var(--surface-200); }
    .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-top: 20px; }
    .cell { background: var(--surface-0); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
  </style>
</head>
<body>
  <h1>Bot faces</h1>
  <p class="muted">Every shape in a few colours, at sidebar, chat and editor sizes.</p>
  <div class="gal" id="gal"></div>
  <script type="module" src="avatar-gallery.js"></script>
</body>
</html>
